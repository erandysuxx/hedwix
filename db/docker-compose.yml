# Servicios de la DB. Se levantan desde la raíz del repo (docker-compose.yml de la raíz los incluye).

services:
  mongo:
    # mongo:8.x no arranca en kernels Linux >= 6.19 (SERVER-121912); usar 7.0
    image: mongo:7.0
    container_name: mongo-dev
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # Sólo se aplican la primera vez, con el volumen vacío
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      HEDWIX_APP_PASSWORD: ${HEDWIX_APP_PASSWORD}
      HEDWIX_MCP_PASSWORD: ${HEDWIX_MCP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    working_dir: /app
    user: "1000:1000"
    environment:
      # La app sólo recibe su propia URI, no las credenciales de root
      MONGODB_URI: ${MONGODB_URI}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      - ..:/repo:ro   # raíz del repo: funnel/, mcp/, …
    depends_on:
      mongo:
        condition: service_healthy
    command: sleep infinity

  # Jupyter para revisar los datos. Sólo arranca con: docker compose --profile testing up -d notebook
  notebook:
    profiles: ["testing"]
    build:
      context: ..
      dockerfile: db/testing/Dockerfile
    working_dir: /app/testing
    user: "1000:1000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8888:8888"   # sólo esta máquina; por eso Jupyter va sin token
    volumes:
      - .:/app
      - ..:/repo:ro
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.token= --ServerApp.password= --ServerApp.root_dir=/app/testing

volumes:
  mongo-data:
